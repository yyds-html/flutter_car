<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洗省省自助洗车 - 协议与政策中心 | Flutter Car Legal Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F2F7F3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #D7E8DB;
      border-radius: 20px;
      padding: 38px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(22, 163, 74, 0.08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #16A34A, #4ADE80);
      border-radius: 14px;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.25);
    }
    h1 {
      font-size: 1.4rem;
      color: #14532D;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p.desc {
      font-size: 0.9rem;
      color: #15803D;
      margin: 0 0 26px 0;
      line-height: 1.5;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin-bottom: 14px; }
    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F6FBF7;
      color: #166534;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid #D7E8DB;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.2s;
    }
    a:hover {
      background: #16A34A;
      color: #FFFFFF;
      border-color: #16A34A;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
    }
    .tag { font-size: 0.78rem; opacity: 0.8; font-weight: normal; }
    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      font-size: 0.82rem;
      color: #94A3B8;
      text-decoration: none;
    }
    .back:hover { color: #16A34A; }
    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #ADB5BD;
      border-top: 1px solid #F1F3F5;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">洗</div>
    <h1>洗省省自助洗车</h1>
    <p class="desc">协议与政策中心 · Legal &amp; Privacy Portal</p>
    <ul>
      <li><a href="./privacy.html"><span>🔒 隐私保护政策</span><span class="tag">Privacy Policy</span></a></li>
      <li><a href="./terms.html"><span>📋 用户服务协议</span><span class="tag">Terms of Service</span></a></li>
    </ul>
    <a class="back" href="https://github.com/yyds-html">&larr; 返回 yyds-html 组织主页</a>
    <footer>&copy; 2026 洗省省自助洗车. All rights reserved.</footer>
  </div>
</body>
</html>
